name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          set -eo pipefail
          files=$(git ls-files -z -- '*.go' ':!:vendor/*' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            echo "Unformatted Go files (run gofmt -w):"
            echo "$files"
            exit 1
          fi

      - name: Vet
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
        run: go vet ./...

      - name: Test
        env:
          GOCACHE: ${{ github.workspace }}/.gocache
        run: go test ./...
