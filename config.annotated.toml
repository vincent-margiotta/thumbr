## Thumbr annotated configuration
# Copy what you need into config.toml/json/yaml; unset fields use built-ins.

# Root directory of your notes ("box"). Positional CLI path overrides this.
noteRoot = "samples/notes"

# Set a deterministic RNG seed for random jumps (int64). Omit for nondeterministic.
# randomSeed = 12345

# Use terminal alternate screen buffer; set false to stay on main screen.
altScreen = true

# File extensions to include (case-insensitive). Leading dot required.
includeExts = [".txt"]

# Glob patterns to ignore (matched on path and basename).
ignoreGlobs = ["Archive/*", "**/*.tmp"]

# Sorting: "natural" vs "lexical"; pattern controls which names use sortMode.
sortMode = "natural"
sortPattern = "^[0-9]+[A-Za-z0-9]*$"
# When true, names matching sortPattern come first; false puts them after.
sortPatternFirst = false

# Colors (hex). Override to match your theme.
colorMark = "#6CCB5F"
colorMuted = "#444444"
colorHi = "#FFD166"
colorDim = "#666666"
colorStatusBG = "#222222"
colorStatusFG = "#F5F5F5"
colorStatusDim = "#999999"

# Layout and motion tuning.
pageStep = 0              # 0 = half the overlay body height
navMaxStep = 8            # hard cap on cards skipped per keypress
navTau     = 300.0        # breakeven interval (ms): pressing at this rate → step=1; faster → more
navGamma   = 1.75         # power-law exponent; higher = sharper acceleration with pressing speed
navMinDt   = 50.0         # minimum interval floor (ms); key-hold == pressing at top speed
stackVisible = 7          # cards shown in stack
stackOffsetX = 2
stackOffsetY = 1
# Card dimensions. Set to 0 (default) for automatic sizing:
#   width  → derived from textWidth + 4 (borders + inner margin); falls back to 60% viewport
#   height → derived from width to preserve a 4"×6" landscape aspect ratio
# Set a value in (0,1] to fix the dimension as a fraction of the viewport instead.
cardWidthFrac = 0
cardHeightFrac = 0
activeLiftY = 2
stickyOverlayNav = false  # keep overlay nav active when toggling?
maxCursorDepth = 2        # how deep the active card can sit in stack

# Border characters (single rune each).
borderCorner = "+"  # overrides all four corners to the same char; leave blank to use defaults
borderH = "─"
borderV = "│"

# Keybindings (strings as used by Bubble Tea). Comma-separated in flags; arrays here.
bindUp = ["k", "up"]
bindDown = ["j", "down"]
bindRandom = ["r"]
bindOverlay = ["enter"]
bindEdit = ["E"]           # open card in external $EDITOR
bindInApp = ["e"]         # open card in in-app vim editor; resumes a suspended editor if one exists
bindSuspendEditor = ["ctrl+b"]  # suspend in-app editor and return to browse (press e to resume)
bindBox = ["b"]
bindNewFile = ["a"]
bindMark = ["m"]
bindFilter = ["t"]
bindHelp = ["?", "h"]
bindQuit = ["q"]
bindPageNext = ["n"]
bindPagePrev = ["p"]
bindOverlayUp = ["k", "up"]
bindOverlayDown = ["j", "down"]
bindReload = ["R"]

# Luhmann-style card continuation: appends the next alternating component.
# e.g. "16a" → "16a1", "16a1" → "16a1a". Falls back to new-file prompt if name
# doesn't match the pattern.
bindContinue = ["c"]

# Luhmann-style card branching: increments the last component as a sibling.
# e.g. "16a" → "16b", "16a1" → "16a2". Falls back to new-file prompt on mismatch.
bindBranch = ["C"]

# Create the next integer root card (e.g. 17 if 16 is the highest integer stem).
# Falls back to the new-file prompt if no integer-named cards exist.
bindNextRoot = ["N"]

# Jump to the first card in the deck. Also acts as a prefix: gg = first card,
# g1–g9 = jump to 10%–90% through the deck.
bindNavFirst = ["g"]

# Jump to the last card in the deck.
bindNavLast = ["G"]

# Shell command to derive the continuation filename stem instead of the built-in
# Luhmann algorithm. Receives the source card stem as the first argument and must
# output the new stem on stdout. Falls back to the prompt on error.
# continueNameCmd = ""

# Same override for branch derivation.
# branchNameCmd = ""

# printf template for the backwards link written at the top of newly created files.
# %s is replaced with the source card's filename stem. Set to "" to disable.
newFileLinkTemplate = "--> %s\n\n"

# When true, linked files are created in the same directory as the focused card.
# When false, they are always created in the box root.
newFileSameDir = true

# What to open when c/C creates a new card: "inapp" (default), "external" ($EDITOR), "none".
newFileEditor = "inapp"

# When true and newFileEditor is "inapp", c/C opens source and new card in a split-pane editor.
autoSplitOnLink = true

# Automatically reload the card list when files change on disk. Set false to
# disable (e.g. on networked filesystems where FS events are unreliable).
liveReload = true

# Controls what the e key opens. "inapp" (default) uses the built-in editor;
# "external" opens $EDITOR instead. c/C/N always use the in-app split-pane
# regardless of this setting.
editMode = "inapp"

# Hard-wrap column for the in-app editor. When a line exceeds this width, the
# last space at or before the column is replaced with a newline. Set to 0 to disable.
textWidth = 80

# Key to switch focus between split editor panes.
bindSwitchPane = ["ctrl+w"]

# Debug overlay: disabled by default. Set true to allow the Debug keybinding.
enableDebugUI = false

# Crash log path; if empty, defaults to ~/.thumbr/crash.log. Written only on panic.
crashLogPath = ""
