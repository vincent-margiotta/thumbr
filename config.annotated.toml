## Thumbr annotated configuration
# Copy what you need into config.toml/json/yaml; unset fields use built-ins.

# Root directory of your notes ("box"). Positional CLI path overrides this.
noteRoot = "samples/notes"

# Set a deterministic RNG seed for random jumps (int64). Omit for nondeterministic.
# randomSeed = 12345

# Use terminal alternate screen buffer; set false to stay on main screen.
altScreen = true

# File extensions to include (case-insensitive). Leading dot required.
includeExts = [".txt"]

# Glob patterns to ignore (matched on path and basename).
ignoreGlobs = ["Archive/*", "**/*.tmp"]

# Sorting: "natural" vs "lexical"; pattern controls which names use sortMode.
sortMode = "natural"
sortPattern = "^[0-9]+[A-Za-z0-9]*$"
# When true, names matching sortPattern come first; false puts them after.
sortPatternFirst = false

# Colors (hex). Override to match your theme.
colorMark = "#6CCB5F"
colorMuted = "#444444"
colorHi = "#FFD166"
colorDim = "#666666"
colorStatusBG = "#222222"
colorStatusFG = "#F5F5F5"
colorStatusDim = "#999999"

# Layout and motion tuning.
pageStep = 0              # 0 = half the overlay body height
navAccelMs = 350          # ms window for acceleration
navMaxStep = 8            # max accelerated step
stackVisible = 7          # cards shown in stack
stackOffsetX = 2
stackOffsetY = 1
cardWidthFrac = 0.6
cardHeightFrac = 0.6
activeLiftY = 2
stickyOverlayNav = false  # keep overlay nav active when toggling?
maxCursorDepth = 2        # how deep the active card can sit in stack

# Border characters (single rune each).
borderCorner = "+"
borderH = "-"
borderV = "|"

# Keybindings (strings as used by Bubble Tea). Comma-separated in flags; arrays here.
bindUp = ["k", "up"]
bindDown = ["j", "down"]
bindRandom = ["r"]
bindOverlay = ["enter"]
bindEdit = ["E"]           # open card in external $EDITOR
bindInApp = ["e"]         # open card in in-app vim editor
bindBox = ["b"]
bindNewFile = ["a"]
bindMark = ["m"]
bindFilter = ["t"]
bindHelp = ["?", "h"]
bindQuit = ["q"]
bindPageNext = ["n"]
bindPagePrev = ["p"]
bindOverlayUp = ["k", "up"]
bindOverlayDown = ["j", "down"]
bindReload = ["R"]

# Luhmann-style card continuation: appends the next alternating component.
# e.g. "16a" → "16a1", "16a1" → "16a1a". Falls back to new-file prompt if name
# doesn't match the pattern.
bindContinue = ["c"]

# Luhmann-style card branching: increments the last component as a sibling.
# e.g. "16a" → "16b", "16a1" → "16a2". Falls back to new-file prompt on mismatch.
bindBranch = ["C"]

# Shell command to derive the continuation filename stem instead of the built-in
# Luhmann algorithm. Receives the source card stem as the first argument and must
# output the new stem on stdout. Falls back to the prompt on error.
# continueNameCmd = ""

# Same override for branch derivation.
# branchNameCmd = ""

# printf template for the backwards link written at the top of newly created files.
# %s is replaced with the source card's filename stem. Set to "" to disable.
newFileLinkTemplate = "--> %s\n\n"

# When true, linked files are created in the same directory as the focused card.
# When false, they are always created in the box root.
newFileSameDir = true

# What to open when c/C creates a new card: "inapp" (default), "external" ($EDITOR), "none".
newFileEditor = "inapp"

# Debug overlay: disabled by default. Set true to allow the Debug keybinding.
enableDebugUI = false

# Crash log path; if empty, defaults to ~/.thumbr/crash.log. Written only on panic.
crashLogPath = ""
